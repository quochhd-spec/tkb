<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef1ff;--card:#fff;--ink:#1d2850;--mute:#8590b3;--line:#dde3fa;--bar:#4f63e8;--chip:#f3f5ff;--sel:#ffe1c8;--selb:#f0a066;--today:#f5b83d;--bgl:92%;--bdl:70%;--txl:26%;--hatch:#e8edfb;--shadow:0 6px 24px rgba(79,99,232,.12)}

:root[data-theme="dark"]{--bg:#10162b;--card:#192140;--ink:#e8ecff;--mute:#93a0cc;--line:#2a3560;--bar:#3f4fc4;--chip:#222c52;--sel:#5a3a22;--selb:#d98b4c;--bgl:24%;--bdl:45%;--txl:86%;--hatch:#222c52;--shadow:none}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input{font-family:inherit}
:focus-visible{outline:3px solid #ffb84d;outline-offset:2px}
.bar{background:var(--bar);color:#fff;padding:12px clamp(14px,3vw,32px);display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.pill{border:0;border-radius:99px;background:#fff;color:#2a3a9c;font-weight:600;font-size:14px;padding:8px 16px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.pill:hover{background:#eef1ff}
.pill.round{padding:8px 13px}
.info{flex:1;min-width:220px;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:center;font-size:13px}
.info span{opacity:.85}
.info b{font-size:clamp(15px,2vw,19px);font-weight:800}
.note{justify-self:start;background:#f7c948;color:#4a3500;border-radius:99px;padding:1px 12px;font-weight:700}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.ov{position:fixed;inset:0;background:rgba(20,28,70,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.ov.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(300px,88vw);background:var(--card);z-index:21;transform:translateX(-102%);transition:transform .22s;padding:calc(18px + env(safe-area-inset-top,0px)) 14px 18px;overflow:auto;box-shadow:var(--shadow)}
.drawer.on{transform:none}
.drawer h3{margin:0 0 12px;font-size:19px;font-weight:800}
.search{width:100%;padding:10px 14px;border:2px solid var(--line);border-radius:12px;background:var(--chip);color:var(--ink);font-size:14px}
.search:focus{border-color:var(--bar);outline:none}
.grp{background:var(--chip);border-radius:16px;margin-top:10px;padding:4px 12px 8px}
.gt{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:var(--ink);padding:9px 0;font-size:15px;cursor:pointer;text-align:left}
.gt i{width:12px;height:12px;border-radius:50%;flex:none}
.gt b{flex:1;font-weight:700}
.gt span{color:var(--mute);font-weight:700;font-size:18px}
.gb small{display:block;color:var(--mute);font-size:12px;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips button{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:4px 12px;font-size:13px;font-weight:600;cursor:pointer}
.chips button:hover{border-color:var(--bar)}
.chips button[aria-current=true]{background:var(--sel);border-color:var(--selb)}
.none{color:var(--mute);padding:14px 4px}
main{padding:18px clamp(12px,3vw,32px) 12px;display:grid;gap:18px}
.card{background:var(--card);border-radius:22px;padding:16px;box-shadow:var(--shadow)}
.card h2{margin:2px 6px 12px;font-size:clamp(19px,2.4vw,26px);font-weight:800}
.card h2 small{margin-left:10px;font-size:13px;font-weight:600;color:var(--mute)}
.wrap{overflow-x:auto}
.sheet{font-size:calc(14px*var(--z,1))}
.grid{display:grid;grid-template-columns:calc(60px*var(--z,1)) repeat(6,minmax(calc(108px*var(--z,1)),1fr));gap:6px;min-width:calc(800px*var(--z,1))}
.dh{text-align:center;padding:8px 4px;border-radius:10px;background:var(--bar);color:#fff;font-weight:700;font-size:.9em}
.dh.today{background:var(--today);color:#3a2a00}
.band{grid-column:1/-1;font-weight:700;font-size:.85em;color:var(--bar);padding:8px 4px 0;display:flex;align-items:center;gap:8px}
.band::after{content:"";flex:1;height:2px;background:var(--line);border-radius:2px}
.pl{display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--mute);font-size:.85em;background:var(--chip);border-radius:10px}
.cell{min-height:3.6em;border-radius:10px;padding:6px 8px;display:flex;flex-direction:column;justify-content:center;text-align:center;align-items:center}
.cell.on{background:hsl(var(--h) 85% var(--bgl));border-left:5px solid hsl(var(--h) 72% var(--bdl));color:hsl(var(--h) 55% var(--txl))}
.cell.on b{font-size:.95em;font-weight:800;line-height:1.25;word-break:break-word}
.cell.on span{font-size:.8em;font-weight:600;opacity:.85;word-break:break-word}
.cell.off{border:2px dashed var(--line);color:var(--mute);font-size:.85em}
.cell.x{background:repeating-linear-gradient(135deg,var(--hatch) 0 6px,transparent 6px 12px);color:var(--mute);font-size:.85em}
.cell.multi{padding:5px;gap:4px;justify-content:flex-start;background:var(--chip);align-items:stretch;text-align:left}
.gp{border-left:4px solid hsl(var(--h) 72% var(--bdl));background:hsl(var(--h) 85% var(--bgl));color:hsl(var(--h) 55% var(--txl));border-radius:8px;padding:4px 6px}
.gp b{display:block;font-size:.9em;font-weight:800}
.gp span,.gp small{display:block;font-size:.76em;font-weight:600;opacity:.85}
.foot{margin:4px clamp(12px,3vw,32px) 28px;color:var(--mute);font-size:12.5px}
</style>

const DAYS = ["Thứ 2","Thứ 3","Thứ 4","Thứ 5","Thứ 6","Thứ 7"];
const COL = ["#e5484d","#f08a3c","#f2c230","#4cd07d","#5ec8e8","#4f7cf0","#9b6df0"];
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hue = s => { let h = 7; for (const ch of s.split("/")[0].trim()) h = (h * 31 + ch.charCodeAt(0)) % 360; return h; };
DATA.forEach(d => {
  const g = d.rows.flatMap(r => r[1]).filter(Array.isArray).flatMap(c => c[1]);
  d.hay = (d.name + " " + [...new Set(g.map(x => x[2]))].join(" ")).toLowerCase();
});
const KS = [...new Set(DATA.map(d => d.k))];
const todayIdx = (new Date().getDay() + 6) % 7;
let cur = null, all = false, z = 1;
const open = new Set();
try { cur = localStorage.getItem("tkb-lop"); z = parseFloat(localStorage.getItem("tkb-z")) || 1; } catch (e) {}
const h0 = decodeURIComponent(location.hash.slice(1));
if (h0 === "all") all = true; else if (DATA.some(d => d.id === h0)) cur = h0;
if (!DATA.some(d => d.id === cur)) cur = DATA[0].id;
open.add(DATA.find(d => d.id === cur).k);

function gridHtml(d) {
  const perDay = DAYS.map((_, i) => d.rows.reduce((a, r) => a + (Array.isArray(r[1][i]) ? r[1][i][0] : 0), 0));
  let h = '<div style="grid-row:1"></div>' + DAYS.map((n, i) => `<div class="dh${i === todayIdx ? " today" : ""}" style="grid-row:1">${n}</div>`).join("");
  let lastBand = "", row = 1;
  d.rows.forEach(r => {
    const m = r[0].match(/^Tiết (\d+) ([SC])$/);
    const band = m && m[2] === "C" ? "Buổi chiều" : "Buổi sáng";
    if (band !== lastBand) { row++; h += `<div class="band" style="grid-row:${row}">${band}</div>`; lastBand = band; }
    row++;
    h += `<div class="pl" style="grid-row:${row}">${m ? "Tiết " + m[1] : esc(r[0])}</div>`;
    r[1].forEach((c, i) => {
      if (c === -1) return;
      const pos = `grid-column:${i + 2};grid-row:${row}`;
      if (c === "x") h += `<div class="cell x" style="${pos}">-x-</div>`;
      else if (!c) h += `<div class="cell off" style="${pos}">---</div>`;
      else {
        const p = `${pos}/span ${c[0]}`, g = c[1];
        if (g.length === 1) h += `<div class="cell on" style="--h:${hue(g[0][1])};${p}"><b>${esc(g[0][1])}</b><span>${esc(g[0][2])}</span></div>`;
        else h += `<div class="cell multi" style="${p}">${g.map(x => `<div class="gp" style="--h:${hue(x[1])}"><small>${esc(x[0])}</small><b>${esc(x[1])}</b><span>${esc(x[2])}</span></div>`).join("")}</div>`;
      }
    });
  });
  return `<div class="wrap"><div class="sheet"><div class="grid">${h}</div></div></div>`;
}
const card = d => `<section class="card" id="c-${esc(d.id)}"><h2>Lớp ${esc(d.name)}<small>Khối ${d.k}</small></h2>${gridHtml(d)}</section>`;
function renderMain() {
  $("#main").innerHTML = all ? DATA.map(card).join("") : card(DATA.find(d => d.id === cur));
  $("#allBtn").textContent = all ? "Xem từng lớp" : "Xem tất cả lớp";
  document.title = (all ? "Tất cả các lớp" : "Lớp " + cur) + " · TKB HK1 2026–2027";
}
function renderTree() {
  const q = $("#q").value.trim().toLowerCase();
  let h = "";
  KS.forEach((k, i) => {
    const items = DATA.filter(d => d.k === k && (!q || d.hay.includes(q)));
    if (q && !items.length) return;
    const op = q ? true : open.has(k);
    h += `<div class="grp"><button class="gt" data-k="${k}" aria-expanded="${op}"><i style="background:${COL[i % COL.length]}"></i><b>Khối ${k}</b><span>${op ? "−" : "+"}</span></button>`;
    if (op) h += `<div class="gb"><small>Nhóm lớp</small><div class="chips">${items.map(d => `<button data-id="${esc(d.id)}" aria-current="${!all && d.id === cur}">${esc(d.name)}</button>`).join("")}</div></div>`;
    h += "</div>";
  });
  $("#tree").innerHTML = h || '<div class="none">Không tìm thấy lớp nào.</div>';
}
function setDrawer(on) {
  $("#drawer").classList.toggle("on", on); $("#ov").classList.toggle("on", on);
  $("#drawer").setAttribute("aria-hidden", !on); $("#menuBtn").setAttribute("aria-expanded", on);
  if (on) $("#q").focus();
}
function pick(id) {
  cur = id; all = false;
  try { localStorage.setItem("tkb-lop", id); } catch (e) {}
  history.replaceState(null, "", "#" + id);
  renderMain(); renderTree(); setDrawer(false); window.scrollTo({ top: 0 });
}
function setZ(v) {
  z = Math.min(1.5, Math.max(.8, Math.round(v * 10) / 10));
  document.documentElement.style.setProperty("--z", z);
  try { localStorage.setItem("tkb-z", z); } catch (e) {}
}
$("#menuBtn").onclick = () => setDrawer(!$("#drawer").classList.contains("on"));
$("#ov").onclick = () => setDrawer(false);
document.addEventListener("keydown", e => { if (e.key === "Escape") setDrawer(false); });
$("#zm").onclick = () => setZ(z - .1);
$("#zp").onclick = () => setZ(z + .1);
$("#allBtn").onclick = () => {
  all = !all;
  history.replaceState(null, "", "#" + (all ? "all" : cur));
  renderMain(); renderTree(); window.scrollTo({ top: 0 });
};
$("#q").oninput = renderTree;
$("#tree").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.k) { open.has(b.dataset.k) ? open.delete(b.dataset.k) : open.add(b.dataset.k); renderTree(); }
  else if (all) { cur = b.dataset.id; setDrawer(false); renderTree(); document.getElementById("c-" + cur).scrollIntoView({ behavior: "smooth" }); }
  else pick(b.dataset.id);
};
window.addEventListener("hashchange", () => {
  const id = decodeURIComponent(location.hash.slice(1));
  if (id === "all") { all = true; renderMain(); renderTree(); } else if (DATA.some(d => d.id === id)) pick(id);
});
setZ(z); renderMain(); renderTree();
</script>
