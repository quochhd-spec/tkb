:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1b2a;--card:#162538;--ink:#e6f1fc;--mute:#8aa3bd;--line:#243a54;--accent:#5bb6ff;--accent2:#3dd6c3;--hero1:#173553;--hero2:#124038;--today:#2b2a17;--todayline:#d9a52f;--bgl:24%;--bdl:45%;--txl:86%;--hatch:#1c2d42;--shadow:none}}
:root[data-theme="dark"]{--bg:#0f1b2a;--card:#162538;--ink:#e6f1fc;--mute:#8aa3bd;--line:#243a54;--accent:#5bb6ff;--accent2:#3dd6c3;--hero1:#173553;--hero2:#124038;--today:#2b2a17;--todayline:#d9a52f;--bgl:24%;--bdl:45%;--txl:86%;--hatch:#1c2d42;--shadow:none}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
header{background:linear-gradient(120deg,var(--hero1),var(--hero2));padding:28px clamp(16px,4vw,40px) 22px}
header h1{margin:0;font-size:clamp(22px,3.2vw,34px);font-weight:800;letter-spacing:-.01em}
header p{margin:6px 0 0;color:var(--mute);font-weight:500}
.badge{display:inline-block;margin-top:12px;padding:4px 12px;border-radius:99px;background:var(--card);font-weight:600;font-size:13px;box-shadow:var(--shadow)}
.app{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;padding:20px clamp(16px,4vw,40px) 40px;max-width:1500px;margin:0 auto}
aside{background:var(--card);border-radius:20px;padding:16px;box-shadow:var(--shadow);align-self:start;position:sticky;top:12px}
.search{width:100%;padding:11px 14px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit}
.search:focus{border-color:var(--accent);outline:none}
.search{margin-bottom:12px}
.list{max-height:calc(100vh - 230px);min-height:200px;overflow:auto;display:flex;flex-direction:column;gap:3px;padding-right:2px}
.list button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;color:var(--ink);padding:8px 10px;border-radius:11px;font:inherit;cursor:pointer}
.list button:hover{background:var(--bg)}
.list button[aria-current=true]{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff}
.list .c{font-weight:700;font-size:12px;min-width:42px;opacity:.75}
.list .n{font-weight:500}
.empty-list{color:var(--mute);padding:12px}
main{min-width:0}
.top{background:var(--card);border-radius:20px;padding:18px 22px;box-shadow:var(--shadow);display:flex;flex-wrap:wrap;gap:14px 28px;align-items:center;justify-content:space-between;margin-bottom:16px}
.top h2{margin:0;font-size:clamp(20px,2.6vw,28px);font-weight:800}
.top h2 small{display:block;font-size:13px;font-weight:600;color:var(--mute)}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:var(--bg);border-radius:14px;padding:8px 16px;text-align:center;min-width:84px}
.stat b{display:block;font-size:22px;font-weight:800;color:var(--accent)}
.stat span{font-size:12px;color:var(--mute);font-weight:500}
.printbtn{border:2px solid var(--line);background:none;color:var(--ink);border-radius:12px;padding:8px 14px;font:600 13px inherit;font-family:inherit;cursor:pointer}
.printbtn:hover{border-color:var(--accent)}
.wrap{background:var(--card);border-radius:20px;padding:14px;box-shadow:var(--shadow);overflow-x:auto}
.grid{display:grid;grid-template-columns:62px repeat(6,minmax(104px,1fr));gap:6px;min-width:780px}
.dh{text-align:center;padding:8px 4px;border-radius:12px;background:var(--bg);font-weight:700}
.dh small{display:block;font-weight:500;color:var(--mute);font-size:12px}
.dh.today{background:var(--todayline);color:#3a2a00}
.dh.today small{color:#3a2a00}
.band{grid-column:1/-1;font-weight:700;font-size:13px;color:var(--accent);padding:10px 4px 2px;display:flex;align-items:center;gap:8px}
.band::after{content:"";flex:1;height:2px;background:var(--line);border-radius:2px}
.pl{display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--mute);font-size:13px;background:var(--bg);border-radius:12px}
.cell{min-height:58px;border-radius:12px;padding:7px 8px;display:flex;flex-direction:column;justify-content:center}
.cell.on{background:hsl(var(--h) 85% var(--bgl));border-left:5px solid hsl(var(--h) 72% var(--bdl));color:hsl(var(--h) 55% var(--txl))}
.cell.on b{font-size:16px;font-weight:800;line-height:1.2}
.cell.on span{font-size:12px;font-weight:600;opacity:.85;word-break:break-word}
.cell.off{border:2px dashed var(--line)}
.cell.x{background:repeating-linear-gradient(135deg,var(--hatch) 0 6px,transparent 6px 12px)}
.cell.td.off{background:var(--today);border-color:var(--todayline)}
.foot{margin:14px 4px 0;color:var(--mute);font-size:12.5px}
@media (max-width:860px){.app{grid-template-columns:1fr}aside{position:static}.list{max-height:240px;min-height:0}}
@media print{header,aside,.printbtn{display:none}.app{display:block;padding:0}.top,.wrap{box-shadow:none}body{background:#fff}}
</style>

    const band = m && m[2] === "C" ? "Buổi chiều" : "Buổi sáng";
    if (band !== lastBand) { h += `<div class="band">${band}</div>`; lastBand = band; }
    h += `<div class="pl">${m ? "Tiết " + m[1] : esc(r[0])}</div>`;
    r[1].forEach((c, i) => {
      const td = i === todayIdx ? " td" : "";
      if (c === "x") h += `<div class="cell x${td}" title="Không xếp tiết"></div>`;
      else if (!c) h += `<div class="cell off${td}"></div>`;
      else h += `<div class="cell on${td}" style="--h:${hue(c[1])}"><b>${esc(c[0])}</b><span>${esc(c[1])}</span></div>`;
    });
  });
  $("#grid").innerHTML = h;
  document.title = `${d.code} ${d.kind === "gv" ? d.label : ""} · TKB HK1 2026–2027`.replace("  ", " ");
}
function select(id) {
  cur = id;
  try { localStorage.setItem("tkb-cur", id); } catch (e) {}
  history.replaceState(null, "", "#" + id);
  renderList(); renderGrid();
}
$("#list").addEventListener("click", e => { const b = e.target.closest("button[data-id]"); if (b) select(b.dataset.id); });
$("#q").addEventListener("input", renderList);
window.addEventListener("hashchange", () => { const id = location.hash.slice(1); if (DATA.some(d => d.id === id)) select(id); });
renderList(); renderGrid();
</script>
</body>
</html>
